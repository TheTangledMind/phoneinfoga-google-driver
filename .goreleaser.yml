version: 2
project_name: phoneinfoga-google-driver
before:
  hooks:
    - go mod download
builds:
  - binary: phoneinfoga-google-driver
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
archives:
  - formats: [tar.gz]
    files: [README.md, VALIDATION.md, LICENSE]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
